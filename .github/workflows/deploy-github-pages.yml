# 推送到 main 后构建并发布到 GitHub Pages
# 首次使用：Repo → Settings → Pages → Build and deployment → Source 选 “GitHub Actions”
#
# 站点地址（仓库为「普通项目」时）：
#   https://<你的用户名>.github.io/<仓库名>/
# 若仓库名为 <用户名>.github.io（用户站点、域名根目录），请把下方 build 步骤里的
#   VITE_BASE_URL 改为 / 或删除 env 整段，否则资源路径会错。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          # 与 GitHub Pages 项目站的子路径一致（前后都要有 /）
          VITE_BASE_URL: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
